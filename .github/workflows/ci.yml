# Per-repo CI for xchain-hub. The gate delegates to the shared reusable workflow;
# a dedicated perf job runs the performance suite against a real MariaDB.
#
# Why a separate job instead of run-perf on the reusable call: a caller cannot
# inject a `services:` container into a reusable (workflow_call) job, and GitHub
# Actions has no conditional service, so wiring MariaDB into the shared workflow
# would force all ~8 other callers to spin up a database they never use. Keeping
# the DB here means only the hub pays for it.
name: CI

# Least privilege for the default GITHUB_TOKEN: every job here only reads the repo.
permissions:
  contents: read

on:
  push:
    # develop is where all work lands; master only ever receives release PRs.
    # Both run the gate: develop so a lane push is verified as it lands, master
    # so the merge commit a release tag points at has its own green run.
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  ci:
    uses: XChain-Platform/.github/.github/workflows/ci-reusable.yml@6f4d39ae85787fc31e90a31588d87610a2c33103 # pin: XChain-Platform/.github @ master 2026-08-14; bump deliberately
    # Perf now runs in the dedicated `perf` job below (with a database), so the
    # gate does not also run the self-skipping perf step.

  # Dedicated perf job with a real MariaDB. This tier is deliberately outside
  # `npm run ci`, and so outside the pre-push venue gate: a caller cannot inject
  # a `services:` container into the shared reusable workflow's job, and the
  # suite needs one. Declared as separate in the platform's
  # claude/bin/ci-job-reachability-config.json, which is what keeps a job that
  # nothing else runs from going dark unnoticed.
  perf:
    # Only spend the perf runtime once the gate is green.
    needs: ci
    runs-on: ubuntu-latest
    # Backstop: the suite itself finishes in minutes; without this, a hung
    # process (e.g. an open DB pool handle keeping node alive) burns the
    # 6-hour default and queues up concurrent runs behind it.
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          # Empty root password: the perf suite's testDb helper defaults to
          # user root / empty password on 127.0.0.1:3306, so the container needs
          # no credential literal. The DB is ephemeral and holds only synthetic
          # test data. MARIADB_DATABASE pre-creates the schema-less DB the helper
          # then populates via verifyTables() (auto-creates tables from src/sql).
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1
          MARIADB_DATABASE: xchain_hub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run performance suite
        env:
          # testDb helper defaults already match the service (127.0.0.1:3306,
          # root, empty password, xchain_hub_test); set explicitly for clarity.
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3306"
          TEST_DB_USER: root
          TEST_DB_NAME: xchain_hub_test
          # Keep the soak bounded so CI stays fast (suite default is 120s).
          SOAK_DURATION_MS: "15000"
        run: npm run test:perf

  # Consensus/governance/reorg/oracle regression suite. Fully mocked
  # (no DB, no network), so it runs as a plain job; kept out of the shared
  # reusable workflow so the other ~8 callers don't inherit a suite only the
  # hub has.
  #
  # The same suite is now also inside `npm run ci` (ci:regression), which is what
  # the pre-push venue gate runs. It was reachable ONLY from here for two months,
  # and while Actions was unpaid that meant reachable from nothing: two suites
  # rotted against deliberate source changes with no signal. The seconds this
  # duplicates buy a red gate before the push instead of after it; the job stays
  # so the required-status-check name survives.
  regression:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run regression suite
        # Same entry point the gate uses, so the two can never drift apart.
        run: npm run ci:regression

  # Cross-repo drift guards, canonical side. The hub OWNS the
  # canonical coin registry (consumers byte-compare against it in their own
  # drift-guards jobs), so here the guard is the consensus-pin conformance of
  # the canonical bundle itself, plus the one artifact the hub consumes from
  # elsewhere: the served chain-registry snapshot, canonical in xchain-wallet.
  # xchain-wallet is private pre-launch, so its checkout uses a read-only
  # deploy key; drop the ssh-key line when the repos flip public at launch.
  drift-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: xchain-hub

      - name: Check out the canonical chain descriptors (xchain-wallet)
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-wallet
          ref: ${{ github.ref == 'refs/heads/master' && 'master' || 'develop' }}
          ssh-key: ${{ secrets.XCHAIN_WALLET_DEPLOY_KEY }}
          path: xchain-wallet

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Chain-registry snapshot vs canonical wallet descriptors
        run: node xchain-wallet/bin/sync-chain-registry.mjs --check

      - name: Coin consensus-pin conformance (canonical bundle)
        working-directory: xchain-hub
        run: |
          node -e '
            const coins = require("./src/coins");
            for (const net of ["testnet", "regtest"]) {
              const res = coins.verifyConsensusPin(net);
              if (res && res.skipped) throw new Error("consensus pin unexpectedly unarmed for " + net);
            }
            console.log("consensus pin conformance OK (testnet, regtest)");
          '

  # Coverage ratchet: re-run the unit suite under c8 and fail if line or
  # branch coverage drops below this repo's floor in bin/coverage-thresholds.json
  # (mirrored into the `coverage:check` npm script). Catches silent coverage
  # regression the pass/fail gate cannot see: a change that keeps every test green
  # while deleting the only test that reached a file. These are RATCHET FLOORS
  # (~1-1.5 points below measured), not tier targets; raise them as coverage climbs.
  coverage:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The ratchet re-runs the unit suite, so it needs the same siblings the gate
      # gets. Without them the guards that read a sibling skip silently, so the
      # ratchet measures a suite the gate never ran: 3713 of 3796 unit tests ran without them.
      # Same roster (.ci-siblings) and same layout the shared workflow uses.
      - name: Check out declared sibling repositories
        env:
          SIBLINGS_REF: ${{ github.ref == 'refs/heads/master' && 'master' || 'develop' }}
        run: |
          set -euo pipefail
          repos=$(sed 's/#.*//' .ci-siblings | tr -d '\r' | awk 'NF')
          cd "$GITHUB_WORKSPACE/.."
          for repo in $repos; do
            rm -rf "$repo"
            url="https://github.com/${{ github.repository_owner }}/$repo.git"
            git clone --quiet --depth 1 --branch "$SIBLINGS_REF" "$url" "$repo" 2>/dev/null \
              || git clone --quiet --depth 1 "$url" "$repo"
            echo "sibling $repo @ $(git -C "$repo" rev-parse --abbrev-ref HEAD) $(git -C "$repo" rev-parse --short HEAD)"
            if [ -f "$repo/package.json" ]; then
              ( cd "$repo" && npm ci --omit=dev --ignore-scripts --no-audit --no-fund >/dev/null 2>&1 ) \
                || ( cd "$repo" && npm install --omit=dev --ignore-scripts --no-audit --no-fund >/dev/null 2>&1 ) \
                || echo "sibling $repo: dependency install failed"
            fi
          done

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Coverage thresholds (c8 --check-coverage)
        run: npm run coverage:check
