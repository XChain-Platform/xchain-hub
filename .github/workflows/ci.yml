name: CI

# Runs the hermetic test gate (`npm run ci`) on every push to master and on
# PRs targeting master. The gate is the unit suite — fully mocked (proxyquire
# + sinon), so no MariaDB or live services are required on the runner.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer push to the same ref cancels an in-progress run — saves Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test gate
        run: npm run ci
