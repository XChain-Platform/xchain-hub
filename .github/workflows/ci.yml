# FINAL - the slim per-repo replacement for .github/workflows/ci.yml
# Drop this into each npm repo. It does nothing but delegate to the shared definition.
# Pinned @master: push the reusable workflow once and every caller picks it up on its
# next run. (Switch to a moving @v1 tag later if you want change-control.)
name: CI

on:
  push:
    branches: [master]          # use [main] for repos whose default branch is main
  pull_request:
    branches: [master]

jobs:
  ci:
    uses: XChain-Platform/.github/.github/workflows/ci-reusable.yml@master
    with:
      # Opt into the perf gate: the hub's perf suites self-skip when MariaDB is
      # absent, so they are safe to run on a bare CI runner as a post-gate step.
      run-perf: true
      perf-script: "test:perf"
      # node-version: "20"   # override the Node major here if ever needed
